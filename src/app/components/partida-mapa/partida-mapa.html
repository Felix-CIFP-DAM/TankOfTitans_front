<div class="mapa-viewport" (mousedown)="onMouseDown($event)">
    <div class="mapa-container" 
         [style.transform]="'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + zoomLevel + ')'">
         
         <div *ngFor="let row of capa_suelo; let y = index" class="mapa-row">
             <div *ngFor="let tile of row; let x = index" class="tile-cell" (click)="onClickCasilla(x, y)">
                 <div class="base-layer"></div>
                 <div class="tile" [ngStyle]="getTileStyle(capa_suelo[y][x])"></div>
                 <div class="object-tile" *ngIf="capa_objetos[y][x]" [ngStyle]="getObjectStyle(capa_objetos[y][x])"></div>
                 
                 <!-- Base markers -->
                 <div class="base-marker" *ngIf="capa_objetos[y][x]?.tipo === 'Base_J1' || capa_objetos[y][x]?.tipo === 'Base_J2'">
                     <span class="base-badge" [class.my-base]="isMyBase(capa_objetos[y][x]?.tipo)">
                         {{ capa_objetos[y][x]?.tipo === 'Base_J1' ? baseInfo.j1 : baseInfo.j2 }}
                     </span>
                 </div>
                 
                 <!-- Capa 3: Tanques del GameState -->
                 <ng-container *ngFor="let t of gameState?.tanques">
                    <div class="object-tile tank-unit" *ngIf="t.posX === x && t.posY === y" 
                        [class.rival]="t.propietarioId !== miUsuario?.id">
                        <!-- Use miniature if available, fallback to CSS sprite if not -->
                        <img *ngIf="t.miniatura" [src]="'/vehiculos/miniaturas/' + t.miniatura" alt="tank" class="map-tank-img">
                        <div *ngIf="!t.miniatura" style="width: 100%; height: 100%;" [ngStyle]="getObjectStyle({sheet: 'miscelaneous-1', x: t.tipo === 'ARTILLERIA' ? 2 : 0, y: 0})"></div>
                    </div>
                 </ng-container>
                 
                 <!-- Highlights and Selectors -->
                 <div class="highlight overlay-move" *ngIf="isHighlight(x, y) === 'move'"></div>
                 <div class="highlight overlay-shoot" *ngIf="isHighlight(x, y) === 'shoot'"></div>
                 <div class="highlight overlay-place" *ngIf="isHighlight(x, y) === 'place'"></div>
                 <div class="highlight overlay-selected" *ngIf="selectedBoardTank?.x === x && selectedBoardTank?.y === y"></div>
             </div>
         </div>
    </div>
</div>
