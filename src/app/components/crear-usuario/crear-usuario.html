<!-- Pagina de crear y gestionar usuarios -->
<div class="crear-usuario">
    <div class="crear-usuario-header">
        <h2>Crear Usuario</h2>
    </div>

    <div class="crear-usuario-content">
        <form class="crear-usuario-form">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre">
            </div>
            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password">
            </div>
            <button type="submit">Crear Usuario</button>
        </form>
    </div>
</div>
<div class="lista-usuarios">
    <div class="lista-usuarios-header">
        <h2>Lista de Usuarios</h2>
    </div>
    <div class="lista-usuarios-content">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Nickname</th>
                    <th>Email</th>
                    <th>Roll</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>John</td>
                    <td>Doe</td>
                    <td>[EMAIL_ADDRESS]</td>
                    <td>Usuario</td>
                    <td>
                        <button>Editar</button>
                        <button>Eliminar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
