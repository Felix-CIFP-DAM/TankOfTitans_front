<div class="editor-container" (mouseup)="onMouseUp()" (mouseleave)="onMouseUp()">
    <header class="editor-header">
        <div class="header-info">
            <h1>MAP STRATEGIST</h1>
            <input type="text" [(ngModel)]="nombreMapa" class="map-name-input" placeholder="Nombre del Mapa">
        </div>
        <div class="header-actions">
            <button class="btn-retro" (click)="initGrid()">LIMPIAR</button>
            <button class="btn-retro primary" (click)="saveMap()">GUARDAR EN BD</button>
        </div>
    </header>

    <div class="editor-layout">
        <aside class="palette-container">
            <h3>PALETA DE SPRITES</h3>

            <div class="palette-section">
                <h4>PROPIEDAD DE COLISIÓN</h4>
                <div class="tipo-selector">
                    <button class="btn-tipo" [class.active]="selectedTipo === 'G'" (click)="selectedTipo = 'G'">HIERBA
                        (Pasar)</button>
                    <button class="btn-tipo" [class.active]="selectedTipo === 'W'" (click)="selectedTipo = 'W'">AGUA
                        (Bloqueo)</button>
                </div>
                <p class="palette-info">Define si el sprite que elijas será transitable o no.</p>
            </div>

            <div class="palette-section">
                <h4>SUELO (Imagen Water.jpg)</h4>
                <div class="palette-grid water-palette">
                    <div *ngFor="let y of getNumbers(waterSheet.rows)" class="palette-row">
                        <div *ngFor="let x of getNumbers(waterSheet.cols)" class="palette-tile"
                            [class.selected]="selectedSprite.x === x && selectedSprite.y === y && selectedSprite.sheet === 'water'"
                            [style.background-position]="'-' + (x * 32) + 'px -' + (y * 32) + 'px'"
                            (click)="selectFromPalette(x, y, 'water')">
                        </div>
                    </div>
                </div>
            </div>

            <div class="palette-section">
                <h4>OBJETOS (Imagen objetos.png)</h4>
                <div class="palette-grid grass-palette">
                    <div *ngFor="let y of getNumbers(grassSheet.rows)" class="palette-row">
                        <div *ngFor="let x of getNumbers(grassSheet.cols)" class="palette-tile"
                            [class.selected]="selectedSprite.x === x && selectedSprite.y === y && selectedSprite.sheet === 'world'"
                            [style.background-position]="'-' + (x * 32) + 'px -' + (y * 32) + 'px'"
                            (click)="selectFromPalette(x, y, 'world')">
                        </div>
                    </div>
                </div>
            </div>
        </aside>


        <main class="grid-viewport">
            <div class="grid-container">
                <!-- Column Labels -->
                <div class="labels-row">
                    <div class="label-corner"></div>
                    <div *ngFor="let label of colLabels" class="label-col">{{label}}</div>
                </div>

                <!-- Grid Rows -->
                <div *ngFor="let row of capa_suelo; let y = index" class="grid-row">
                    <div class="label-row">{{rowLabels[y]}}</div>
                    <div *ngFor="let tile of row; let x = index" class="tile-cell" (mousedown)="onMouseDown(x, y)"
                        (mouseenter)="onMouseEnter(x, y)" (contextmenu)="$event.preventDefault(); clearObject(x, y)">

                        <!-- Capa 0: Base Layer (Optional solid grass) -->
                        <div class="base-layer"></div>

                        <!-- Capa 1: Suelo (Manual Selection) -->
                        <div class="tile" [ngStyle]="getTileStyle(capa_suelo[y][x])"></div>

                        <!-- Capa 2: Objetos (Manual Selection) -->
                        <div class="object-tile" *ngIf="capa_objetos[y][x]"
                            [ngStyle]="getObjectStyle(capa_objetos[y][x])"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
